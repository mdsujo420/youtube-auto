name: generate-script

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "en or bn"
        default: "en"
      kinds:
        description: "which videos: 'long short' (default), 'long' or 'short'"
        default: "long short"
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily -> English
    - cron: "0 7 * * *"   # 07:00 UTC daily -> Bangla

permissions:
  contents: write

concurrency:
  group: generate-script
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          for i in 1 2 3; do pip install -r requirements.txt && break || sleep 15; done

      - name: Install ffmpeg and fonts
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core && break || sleep 15
          done
          ffmpeg -version | head -1

      - name: Pick language and videos
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LANG_INPUT: ${{ github.event.inputs.lang }}
          KINDS_INPUT: ${{ github.event.inputs.kinds }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then L="$LANG_INPUT"; K="$KINDS_INPUT"
          elif [ "$SCHEDULE" = "0 7 * * *" ]; then L=bn; K="long short"
          else L=en; K="long short"; fi
          [ -z "$K" ] && K="long short"
          echo "lang=$L" >> "$GITHUB_OUTPUT"
          echo "kinds=$K" >> "$GITHUB_OUTPUT"

      - name: Find a trending topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEN_BUDGET_SECONDS: "300"
          SCRIPT_LANG: ${{ steps.pick.outputs.lang }}
        run: |
          python discover_topic.py --lang "$SCRIPT_LANG" || echo "topic discovery failed; the script step picks a topic itself"

      - name: Write scripts (long first, then the short on the same topic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEN_BUDGET_SECONDS: "1800"
          SCRIPT_LANG: ${{ steps.pick.outputs.lang }}
          KINDS: ${{ steps.pick.outputs.kinds }}
        run: |
          retry() { local label="$1"; shift
            for i in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$rc" -eq 3 ]; then echo "Not retrying $label (key problem)"; return 3; fi
              echo "$label failed (try $i); waiting 2 minutes"; sleep 120
            done
            return 1; }
          for K in $KINDS; do retry "script $K" python generate_script.py --lang "$SCRIPT_LANG" --kind "$K" || exit $?; done

      - name: Generate voiceovers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEN_BUDGET_SECONDS: "2400"
          SCRIPT_LANG: ${{ steps.pick.outputs.lang }}
          KINDS: ${{ steps.pick.outputs.kinds }}
        run: |
          retry() { local label="$1"; shift
            for i in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$rc" -eq 3 ]; then echo "Not retrying $label (quota or key problem)"; return 3; fi
              echo "$label failed (try $i); waiting 2 minutes"; sleep 120
            done
            return 1; }
          for K in $KINDS; do retry "voice $K" python generate_voice.py --lang "$SCRIPT_LANG" --kind "$K" || exit $?; done

      - name: Generate videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SCRIPT_LANG: ${{ steps.pick.outputs.lang }}
          KINDS: ${{ steps.pick.outputs.kinds }}
        run: |
          retry() { local label="$1"; shift
            for i in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$rc" -eq 3 ]; then echo "Not retrying $label (image key problem)"; return 3; fi
              echo "$label failed (try $i); waiting 1 minute"; sleep 60
            done
            return 1; }
          for K in $KINDS; do retry "video $K" python generate_video.py --lang "$SCRIPT_LANG" --kind "$K" || exit $?; done

      - name: Thumbnails and upload kits
        env:
          SCRIPT_LANG: ${{ steps.pick.outputs.lang }}
          KINDS: ${{ steps.pick.outputs.kinds }}
        run: |
          for K in $KINDS; do
            for i in 1 2 3; do
              python generate_package.py --lang "$SCRIPT_LANG" --kind "$K" && break
              echo "package $K failed (try $i)"; sleep 20
              [ "$i" -eq 3 ] && exit 1
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.pick.outputs.lang }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            output/credits_*.txt
            output/upload_kit_*.txt
          if-no-files-found: error
          retention-days: 1

      - name: Save topic history and speaking pace
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history
          git commit -m "update topic history and pace" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 10
          done
