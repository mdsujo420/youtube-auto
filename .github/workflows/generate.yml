name: generate-script

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "en or bn"
        default: "en"
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily -> English
    - cron: "0 7 * * *"   # 07:00 UTC daily -> Bangla

permissions:
  contents: write

concurrency:
  group: generate-script
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          for i in 1 2 3; do pip install -r requirements.txt && break || sleep 15; done

      - name: Pick language
        id: lang
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LANG_INPUT: ${{ github.event.inputs.lang }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then L="$LANG_INPUT"
          elif [ "$SCHEDULE" = "0 7 * * *" ]; then L=bn
          else L=en; fi
          echo "lang=$L" >> "$GITHUB_OUTPUT"

      - name: Generate script (retries up to 3 times)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEN_BUDGET_SECONDS: "720"
          SCRIPT_LANG: ${{ steps.lang.outputs.lang }}
        run: |
          for i in 1 2 3; do
            if python generate_script.py --lang "$SCRIPT_LANG"; then exit 0; fi
            echo "run $i failed; waiting 3 minutes before retrying"
            sleep 180
          done
          echo "All 3 runs failed"
          exit 1

      - name: Generate voiceover (retries up to 3 times)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEN_BUDGET_SECONDS: "900"
          SCRIPT_LANG: ${{ steps.lang.outputs.lang }}
        run: |
          for i in 1 2 3; do
            python generate_voice.py --lang "$SCRIPT_LANG" && exit 0
            rc=$?
            if [ "$rc" -eq 3 ]; then echo "Not retrying (quota used up or key invalid)"; exit 3; fi
            echo "voice run $i failed; waiting 2 minutes before retrying"
            sleep 120
          done
          echo "All 3 voice runs failed"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: script-${{ steps.lang.outputs.lang }}
          path: output/
          if-no-files-found: error

      - name: Save topic history
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history
          git commit -m "update topic history" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 10
          done
